
name: Deploy OutfitPicker to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare OutfitPicker website
        run: |
          echo "Preparing OutfitPicker for Azure"
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            index.html
            style.css
            script.js

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_99A2A2E59BC043A7ABF549C4C1EABA2D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_661F2CFB78D442A58517629C208769B4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_979D5B87E79F42569733A306161DC355 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: outfitpicker-2026
          slot-name: Production
          package: .
